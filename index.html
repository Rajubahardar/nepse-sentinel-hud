<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEPSE Sentinel — J.A.R.V.I.S. Voice HUD</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050a12;
      font-family: 'Consolas', 'Segoe UI', monospace;
    }
    #hud-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
    #voice-hud-strip {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(7, 14, 24, 0.92);
      border: 1px solid rgba(0, 245, 212, 0.6);
      border-left: 3px solid #ff8c00;
      border-right: 3px solid #00f5d4;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      color: #e0f2fe;
      font-size: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
    }
    #voice-status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffb340;
      flex-shrink: 0;
    }
    #voice-status-dot.listening {
      background: #f43f5e;
      box-shadow: 0 0 10px #f43f5e;
    }
    #voice-live-text {
      max-width: 46vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .strip-btn {
      background: rgba(0, 245, 212, 0.16);
      border: 1px solid #00f5d4;
      color: #00f5d4;
      padding: 3px 10px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .strip-btn:hover { background: rgba(0, 245, 212, 0.32); }
    #btn-close-voice {
      border-color: #f43f5e;
      color: #fda4af;
      background: rgba(244, 63, 94, 0.16);
      display: none;
    }
    #btn-close-voice:hover { background: #f43f5e; color: #ffffff; }
  </style>
</head>
<body>

  <div id="voice-hud-strip">
    <span id="voice-status-dot"></span>
    <span id="voice-live-text">STANDBY — SAY "OPEN VOICE COMMAND"</span>
    <button id="btn-open-voice" class="strip-btn" type="button">🎙️ Open Voice</button>
    <button id="btn-close-voice" class="strip-btn" type="button">✕ Close Voice</button>
  </div>

  <iframe id="hud-frame" allow="microphone *; autoplay *; clipboard-write *"></iframe>

  <script>
    const DEFAULT_EXEC_URL = 'https://script.google.com/macros/s/AKfycbwyIMlqcNO4dc5s6P3Aui_aACI-FA0QuzO3ptQs4QQSFRaks8Sy8HIGVQvl-hhRhuGh/exec';
    const STORAGE_KEY = 'nepse_sentinel_webapp_url';
    const hudFrame = document.getElementById('hud-frame');
    const statusDot = document.getElementById('voice-status-dot');
    const liveText = document.getElementById('voice-live-text');
    const btnOpen = document.getElementById('btn-open-voice');
    const btnClose = document.getElementById('btn-close-voice');

    const params = new URLSearchParams(window.location.search);
    const paramUrl = params.get('url');
    if (paramUrl && paramUrl.includes('script.google.com')) {
      localStorage.setItem(STORAGE_KEY, paramUrl.trim());
    }

    hudFrame.src = localStorage.getItem(STORAGE_KEY) || DEFAULT_EXEC_URL;

    function postToHud(msg) {
      if (hudFrame && hudFrame.contentWindow) {
        hudFrame.contentWindow.postMessage(msg, '*');
      }
    }

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let voiceCommandOpen = false;
    let aiSpeaking = false;
    let isRecognizing = false;
    let rec = null;
    let restartTimer = null;

    function updateStripUI() {
      if (voiceCommandOpen) {
        statusDot.classList.add('listening');
        btnOpen.style.display = 'none';
        btnClose.style.display = 'inline-block';
        liveText.style.color = '#00f5d4';
        liveText.textContent = aiSpeaking
          ? 'PAUSED WHILE F.R.I.D.A.Y. SPEAKS…'
          : '● LISTENING — SAY "OPEN CHART", "SHOW BACKTESTING", "TOP LEADS TODAY"';
      } else {
        statusDot.classList.remove('listening');
        btnOpen.style.display = 'inline-block';
        btnClose.style.display = 'none';
        liveText.style.color = '#ffe4b5';
        liveText.textContent = 'STANDBY — SAY "OPEN VOICE COMMAND"';
      }
    }

    function setVoiceCommandOpen(open, notifyHud) {
      voiceCommandOpen = Boolean(open);
      updateStripUI();
      if (notifyHud) {
        postToHud({ type: voiceCommandOpen ? 'JARVIS_VOICE_OPENED' : 'JARVIS_VOICE_CLOSED' });
      }
    }

    function scheduleNextCycle(ms) {
      clearTimeout(restartTimer);
      if (aiSpeaking) return;
      restartTimer = setTimeout(() => {
        if (!isRecognizing && !aiSpeaking) startListeningLoop();
      }, ms);
    }

    function startListeningLoop() {
      if (!SpeechRec || isRecognizing || aiSpeaking) return;

      rec = new SpeechRec();
      rec.lang = 'en-IN';
      rec.continuous = false;
      rec.interimResults = true;
      rec.maxAlternatives = 1;

      let finalSpoken = '';

      rec.onstart = () => {
        isRecognizing = true;
      };

      rec.onresult = (event) => {
        if (aiSpeaking) return;
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const alt = event.results[i][0];
          const txt = String(alt.transcript || '').trim();
          const conf = typeof alt.confidence === 'number' ? alt.confidence : 1;
          const hasCommandWord = /\b(voice command|open|close|chart|backtest|backtesting|lead|leads|top|brain|zoom|reset|briefing|stop|nica|shivm|sahas|phcl|hurja)\b/i.test(txt);

          if (event.results[i].isFinal) {
            if (txt.length >= 2 && (conf >= 0.42 || hasCommandWord)) {
              finalSpoken += ' ' + txt;
            }
          } else {
            interim += ' ' + txt;
          }
        }

        const currentPhrase = (finalSpoken || interim).trim();
        if (!currentPhrase) return;

        if (!voiceCommandOpen && /\b(open voice command|start voice command|activate voice command)\b/i.test(currentPhrase)) {
          finalSpoken = '';
          setVoiceCommandOpen(true, true);
          try { rec.abort(); } catch (e) {}
          return;
        }

        if (voiceCommandOpen) {
          liveText.style.color = '#ffffff';
          liveText.textContent = 'HEARD: "' + currentPhrase.toUpperCase() + '"';
        }
      };

      rec.onerror = (e) => {
        isRecognizing = false;
        if (e.error === 'not-allowed') {
          liveText.style.color = '#f43f5e';
          liveText.textContent = 'MIC BLOCKED — CLICK LOCK ICON IN ADDRESS BAR & ALLOW MICROPHONE';
          return;
        }
        scheduleNextCycle(150);
      };

      rec.onend = () => {
        isRecognizing = false;
        const cleanCmd = finalSpoken.trim();
        if (cleanCmd && !aiSpeaking) {
          if (/\b(close voice command|stop voice command|exit voice command|turn off voice command)\b/i.test(cleanCmd)) {
            setVoiceCommandOpen(false, true);
          } else if (voiceCommandOpen) {
            liveText.style.color = '#00f5d4';
            liveText.textContent = 'EXECUTED: "' + cleanCmd.toUpperCase() + '"';
            postToHud({ type: 'JARVIS_VOICE_CMD', transcript: cleanCmd });
          }
        }
        scheduleNextCycle(120);
      };

      try {
        rec.start();
      } catch (e) {
        isRecognizing = false;
        scheduleNextCycle(300);
      }
    }

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'JARVIS_AI_SPEAKING') {
        aiSpeaking = Boolean(data.speaking);
        if (aiSpeaking && rec && isRecognizing) {
          try { rec.abort(); } catch (e) {}
        } else if (!aiSpeaking) {
          scheduleNextCycle(180);
        }
        updateStripUI();
      } else if (data.type === 'JARVIS_SHELL_SET_VOICE') {
        setVoiceCommandOpen(Boolean(data.open), false);
      }
    });

    btnOpen.addEventListener('click', () => setVoiceCommandOpen(true, true));
    btnClose.addEventListener('click', () => setVoiceCommandOpen(false, true));

    updateStripUI();
    startListeningLoop();
  </script>
</body>
</html>
