    function hashCoord(str, salt) {
      var h = 2166136261 ^ salt;
      for (var i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return ((h >>> 0) / 4294967295) * 2 - 1;
    }

    // =========================================================================

    //    (Frontal lobe facing -X, Cerebellum & Brainstem on lower +X side)
    // =========================================================================
    function buildHolographicInputBrain(centerX) {
      var brainGroup = new THREE.Group();
      brainGroup.position.set(centerX, 4, 0);

      // Cerebrum Wireframe + Luminous Cortical Ridges
      var geo = new THREE.SphereGeometry(1, 56, 42);
      var pos = geo.attributes.position;
      for (var i = 0; i < pos.count; i++) {
        var ux = pos.getX(i); // -1 = Frontal (-X), +1 = Occipital (+X)
        var uy = pos.getY(i); // -1 = Base, +1 = Crown
        var uz = pos.getZ(i); // -1 = Left, +1 = Right Hemisphere

        // Longitudinal fissure indentation along top/front/back midline (uz ~ 0)
        var fissure = 1.0 - 0.14 * Math.exp(-Math.pow(uz / 0.14, 2)) * Math.max(0, uy + 0.35);

        // Frontal lobe (-X) slightly tapered; Parietal crown (+Y) arched
        var x = ux * 82;
        var y = uy * 62 * fissure;
        var z = uz * 54;

        // Carve orbital floor under frontal lobe (-X) and sub-occipital pocket (+X)
        if (ux < -0.15 && y < -18) {
          y = -18 + (y + 18) * 0.28;
        }
        if (ux > 0.22 && y < -16) {
          y = -16 + (y + 16) * 0.22;
        }

        // Temporal lobe bulge on lower mid-sides
        var tempMask = Math.exp(-Math.pow((ux + 0.05) / 0.45, 2)) *
                       Math.exp(-Math.pow((uy + 0.32) / 0.26, 2)) *
                       Math.max(0, Math.abs(uz) - 0.25);
        y -= tempMask * 16;
        z += Math.sign(uz) * tempMask * 10;

        // Sylvian fissure groove separating frontal and temporal lobes
        var sylvianY = -16 + (ux + 0.35) * 26;
        if (ux > -0.45 && ux < 0.22 && Math.abs(uz) > 0.45) {
          var dSylv = Math.abs(y - sylvianY);
          if (dSylv < 7) {
            var indent = (1 - dSylv / 7) * (Math.abs(uz) - 0.45);
            z -= Math.sign(uz) * indent * 11;
          }
        }

        // Dense cortical gyri & sulci folds
        var g1 = Math.sin(x * 0.17 + Math.cos(z * 0.18) * 1.6);
        var g2 = Math.cos(y * 0.19 + Math.sin(x * 0.16) * 1.5);
        var g3 = Math.sin(z * 0.18 + Math.cos(y * 0.17) * 1.6);
        var fold = 1.0 + 0.042 * (g1 * g2 + g2 * g3);

        pos.setXYZ(i, x * fold, (y + 10) * fold, z * fold);
      }
      geo.computeVertexNormals();

      // Silver-white & icy-cyan holographic wireframe
      brainGroup.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        color: 0xcbd5e1,
        wireframe: true,
        transparent: true,
        opacity: 0.13,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })));
      // Luminous cortical point cloud
      brainGroup.add(new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xe0f2fe,
        size: 1.5,
        transparent: true,
        opacity: 0.52,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })));

      // Striated Cerebellum tucked under lower-right Occipital Lobe (+X, -Y)
      var cerebGeo = new THREE.SphereGeometry(1, 32, 22);
      var cPos = cerebGeo.attributes.position;
      for (var j = 0; j < cPos.count; j++) {
        var cx = cPos.getX(j);
        var cy = cPos.getY(j);
        var cz = cPos.getZ(j);
        var folia = 1.0 + 0.045 * Math.sin(cy * 28.0);
        cPos.setXYZ(j, (cx * 26 + 44) * folia, (cy * 19 - 32) * folia, cz * 34 * folia);
      }
      cerebGeo.computeVertexNormals();
      brainGroup.add(new THREE.Mesh(cerebGeo, new THREE.MeshBasicMaterial({
        color: 0xbae6fd, wireframe: true, transparent: true, opacity: 0.18,
        blending: THREE.AdditiveBlending, depthWrite: false
      })));

        color: 0xf0f9ff, size: 1.35, transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending, depthWrite: false
      })));

      // Descending Brainstem at lower-right base
      var stemGeo = new THREE.CylinderGeometry(9.5, 6.5, 38, 16, 5, true);
      var stem = new THREE.Mesh(stemGeo, new THREE.MeshBasicMaterial({
        color: 0x94a3b8, wireframe: true, transparent: true, opacity: 0.2,
        blending: THREE.AdditiveBlending, depthWrite: false
      }));
      stem.position.set(16, -46, 0);
      stem.rotation.z = 0.26;
      brainGroup.add(stem);

      return brainGroup;

        [topPt, upperL, upperF],
        [topPt, upperF, upperR],
        [topPt, upperR, upperB],
        [topPt, upperB, upperL],
        // Mid-body diagonal facets (iconic Obsidian asymmetric cut)
        [upperL, lowerL, upperF],
        [upperF, lowerL, lowerF],
        [upperF, lowerF, upperR],
        [upperR, lowerF, lowerR],
        [upperR, lowerR, upperB],
        [upperB, lowerR, lowerB],
        [upperB, lowerB, upperL],
        [upperL, lowerB, lowerL],

        [lowerL, botPt, lowerF],
        [lowerF, botPt, lowerR],
        [lowerR, botPt, lowerB],

      var verts = [];

    // =========================================================================
    // DEEP-SPACE STARFIELD + ENERGY STREAMS (Brain -> Purple Stone -> Market)
    // =========================================================================
    function buildBackdropAndStreams(activeFnSet, fnNodeMap, sectorNodeMap) {
      while (customGroup.children.length > 0) {
        customGroup.remove(customGroup.children[0]);
      }
      streamPulses = [];

      // 1. Deep-Space Starfield (matches the starry space background in your image)
      var starCount = 850;
      var starGeo = new THREE.BufferGeometry();
      var starPos = new Float32Array(starCount * 3);
      for (var i = 0; i < starCount; i++) {
        starPos[i * 3]     = (Math.random() - 0.5) * 1250;
        starPos[i * 3 + 1] = (Math.random() - 0.5) * 720;
        starPos[i * 3 + 2] = (Math.random() - 0.5) * 900;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
      starField = new THREE.Points(starGeo, new THREE.PointsMaterial({
        color: 0xe2e8f0,
        size: 1.5,
        transparent: true,
        opacity: 0.5,
        depthWrite: false
      }));
      customGroup.add(starField);

      // 2. Left Holographic Brain Mesh around Input Nodes
      customGroup.add(buildHolographicInputBrain(INPUT_CENTER_X));

      // 3. Curved Energy Streams: Input Brain -> Center Purple Stone -> Output Sector Hubs
      var secKeys = Object.keys(sectorNodeMap);
      FUNCTION_TOPOLOGY.forEach(function(fn, idx) {
        var fNode = fnNodeMap[fn.id];
        var sNode = sectorNodeMap[fn.outSector] || sectorNodeMap[secKeys[idx % Math.max(1, secKeys.length)]];
        if (!fNode) return;

        var isAct = activeFnSet.has(fn.id);

        // Stream A: Input Brain Node -> Center Purple Obsidian Stone
        var cIn = new THREE.CubicBezierCurve3(
          new THREE.Vector3(fNode.bx, fNode.by, fNode.bz),
          new THREE.Vector3(-115, fNode.by * 0.45, fNode.bz * 0.45),
          new THREE.Vector3(-55, fNode.by * 0.15, fNode.bz * 0.15),
          new THREE.Vector3(-18, (idx % 5 - 2) * 7, 0)
        );
        var lineIn = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(cIn.getPoints(32)),
          new THREE.LineDashedMaterial({
            color: isAct ? 0x38bdf8 : 0xe879f9,
            dashSize: 2.5,
            gapSize: 1.5,
            transparent: true,
            opacity: isAct ? 0.78 : 0.26,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
        );
        lineIn.computeLineDistances();
        customGroup.add(lineIn);

        var pIn = new THREE.Mesh(
          new THREE.SphereGeometry(isAct ? 1.55 : 0.95, 8, 8),
          new THREE.MeshBasicMaterial({
            color: isAct ? 0x7dd3fc : 0xf0abfc,
            transparent: true,
            opacity: isAct ? 0.95 : 0.55,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
        );
        customGroup.add(pIn);
        streamPulses.push({ mesh: pIn, curve: cIn, t: (idx * 0.17) % 1.0, speed: isAct ? 0.011 : 0.0045 });

        // Stream B: Center Purple Obsidian Stone -> Right Output Sector Starburst Hubs
        if (sNode && idx % 2 === 0) {
          var cOut = new THREE.CubicBezierCurve3(
            new THREE.Vector3(18, (idx % 5 - 2) * 7, 0),
            new THREE.Vector3(65, sNode.ty * 0.25, sNode.tz * 0.25),
            new THREE.Vector3(135, sNode.ty * 0.75, sNode.tz * 0.75),
            new THREE.Vector3(sNode.tx, sNode.ty, sNode.tz)
          );
          var lineOut = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(cOut.getPoints(32)),
            new THREE.LineDashedMaterial({
              color: isAct ? 0xc084fc : 0xe879f9,
              dashSize: 2.5,
              gapSize: 1.5,
              transparent: true,
              opacity: isAct ? 0.72 : 0.26,
              blending: THREE.AdditiveBlending,
              depthWrite: false
            })
          );
          lineOut.computeLineDistances();
          customGroup.add(lineOut);

          var pOut = new THREE.Mesh(
            new THREE.SphereGeometry(isAct ? 1.55 : 0.95, 8, 8),
            new THREE.MeshBasicMaterial({
              color: isAct ? 0x00ff9d : 0xd8b4fe,
              transparent: true,
              opacity: isAct ? 0.95 : 0.55,
              blending: THREE.AdditiveBlending,
              depthWrite: false
            })
          );
          customGroup.add(pOut);
          streamPulses.push({ mesh: pOut, curve: cOut, t: (idx * 0.23) % 1.0, speed: isAct ? 0.011 : 0.0045 });
        }
      });
    }

    function makeTextSprite(text, color, fontSize, opacity) {
      var canvas = document.createElement("canvas");
      var ctx = canvas.getContext("2d");
      canvas.width = 380;
      canvas.height = 72;
      ctx.font = "700 " + fontSize + "px Consolas, Segoe UI, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      var texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      var material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      var sprite = new THREE.Sprite(material);
      sprite.scale.set(34, 6.4, 1);
      return sprite;
    }

      // 3. NRB Gate Node

        );
        group.add(nCore);
        var nGlow = new THREE.Mesh(
          new THREE.SphereGeometry(7.2, 10, 10),
          new THREE.MeshBasicMaterial({ color: 0xff3d57, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        group.add(nGlow);

    // Dynamically update glow intensity so the SELECTED node glows the brightest while others stay normal
    function updateGlowStates() {
      currentNodes.forEach(function(n) {
        if (!n.visuals) return;
        var v = n.visuals;
        var isSelected = (n.id === selectedNodeId);
        var isHovered = (n.id === hoveredNodeId);
        var isNeighbor = highlightNodes.has(n.id);

        if (isSelected) {
          // MAXIMUM SUPER-GLOW ON SELECTED NODE
          v.coreMesh.scale.set(2.1, 2.1, 2.1);
          v.coreMesh.material.color.setHex(0xffffff);
          v.glowMesh.scale.set(2.5, 2.5, 2.5);
          v.glowMesh.material.color.setHex(0x00ff9d);
          v.glowMesh.material.opacity = 0.88;
          v.selRing.visible = true;
          v.selRing.scale.set(1.7, 1.7, 1.7);
          v.lbl.visible = true;
        } else if (isHovered) {
          v.coreMesh.scale.set(1.55, 1.55, 1.55);
          v.coreMesh.material.color.setHex(0x38bdf8);
          v.glowMesh.scale.set(1.7, 1.7, 1.7);
          v.glowMesh.material.color.setHex(0x38bdf8);
          v.glowMesh.material.opacity = 0.62;
          v.selRing.visible = true;
          v.selRing.scale.set(1.3, 1.3, 1.3);
          v.lbl.visible = true;
        } else {
          // NORMAL STATE FOR ALL OTHER NODES
          v.coreMesh.scale.set(1, 1, 1);
          v.coreMesh.material.color.setHex(v.baseHex);
          v.glowMesh.scale.set(1, 1, 1);
          v.glowMesh.material.color.setHex(v.baseHex);
          v.glowMesh.material.opacity = isNeighbor ? 0.36 : (v.isPriority ? 0.28 : 0.04);
          v.selRing.visible = !!v.isHeld;
          v.selRing.scale.set(1, 1, 1);
          v.lbl.visible = v.isPriority || isNeighbor;
        }
      });
    }

    function computeNeighborhood(centerNode) {
      highlightNodes.clear();
      highlightLinks.clear();
      if (!centerNode) return;
      highlightNodes.add(centerNode.id);
      currentLinks.forEach(function(l) {
        var srcId = typeof l.source === "object" ? l.source.id : l.source;
        var tgtId = typeof l.target === "object" ? l.target.id : l.target;
        if (srcId === centerNode.id || tgtId === centerNode.id) {
          highlightLinks.add(l);
          highlightNodes.add(srcId);
          highlightNodes.add(tgtId);
        }
      });
    }

    function refreshHighlights() {
      if (!Graph3D) return;
      var hasActive = highlightNodes.size > 0;
      Graph3D
        .linkColor(function(l) {
          if (!hasActive) return l.baseColor;
          return highlightLinks.has(l) ? "#00ff9d" : "rgba(148, 163, 184, 0.07)";
        })
        .linkWidth(function(l) {
          if (!hasActive) return l.baseWidth;
          return highlightLinks.has(l) ? Math.max(1.6, l.baseWidth * 2.5) : 0.25;
        })
        .linkDirectionalParticles(function(l) {
          if (!hasActive) return l.particles;
          return highlightLinks.has(l) ? 4 : 0;
        });
    }

      }

      if (node.kind === "sector") {
        document.getElementById("hudTitle").textContent = "OUTPUT // SECTOR HUB";
        el.innerHTML = '<div class="card"><h4>STARBURST SECTOR CLUSTER</h4><h3 style="color:#d8b4fe">' + node.label + '</h3><p style="margin-top:6px;font-size:12px">Connected companies: <b>' + node.count + '</b></p></div>';
        return;
      }

      if (node.kind === "nrb") {
        document.getElementById("hudTitle").textContent = "OUTPUT // NRB MACRO GATE";
        el.innerHTML = '<div class="card"><h4>NRB REGULATORY DIRECTIVE</h4><h3 style="color:#ff5252">' + node.label + '</h3><p style="margin-top:6px;font-size:12px">SHA-256 verified central bank rule.</p></div>';
        return;
      }

      if (node.kind !== "ticker") return;
      document.getElementById("hudTitle").textContent = "OUTPUT // SELECTED COMPANY";
      var s = node.data;
      var bCls = s.macro_approved === 0 ? "b-red" : (s.signal === "SCAN" ? "b-purple" : (s.signal === "WATCH" || s.signal === "PULLBACK" ? "b-amber" : "b-green"));
      var kelly = s.kelly_pct > 0 ? (s.kelly_pct * 100).toFixed(1) + "%" : "NORMAL";
      var turnCr = (s.avg_turnover_20d / 1e7).toFixed(2) + " Cr";

      el.innerHTML =
        '<div class="card"><h4>' + s.sector + (s.in_portfolio ? ' ★ HELD' : '') + '</h4>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><h2 style="color:#00ff9d">' + s.ticker + '</h2><span class="badge ' + bCls + '">' + s.signal + '</span></div>' +
        '<div class="kv"><span>LTP</span><b>Rs ' + s.ltp + '</b></div>' +
        '<div class="kv"><span>Entry Zone</span><b>' + (s.entry_zone || '—') + '</b></div>' +
        '<div class="kv"><span>Stop / Target</span><b>' + s.stop_loss + ' / ' + s.target + '</b></div>' +
        '<div class="kv"><span>Half-Kelly</span><b>' + kelly + '</b></div>' +
        '<div class="kv"><span>20D Turnover</span><b>Rs ' + turnCr + '</b></div>' +
        '<div class="kv"><span>NRB Gate</span><b>' + (s.macro_approved === 1 ? 'PASS' : 'BLOCKED') + '</b></div></div>' +
        '<div class="card"><h4>Bull Thesis</h4><p style="font-size:12px;line-height:1.4">' + (s.bull_case || 'Active NEPSE universe company.') + '</p></div>' +
        '<div class="card"><h4>Bear Thesis</h4><p style="font-size:12px;line-height:1.4">' + (s.bear_case || 'Outside top-8 AI committee queue.') + '</p></div>' +
        '<div class="card"><h4>Risk Telemetry</h4><p style="font-size:12px;color:#ffca28;line-height:1.4">' + (s.risk_flag || 'NORMAL') + '</p></div>';
    }

    function init3DScene() {
      var elem = document.getElementById("graph3d");
      Graph3D = ForceGraph3D({ controlType: "orbit" })(elem)
        .backgroundColor("rgba(0,0,0,0)")
        .showNavInfo(false)
        .cooldownTicks(0)
        .nodeThreeObject(buildNodeMesh)
        .nodeThreeObjectExtend(false)
        .linkColor(function(l) { return l.baseColor; })
        .linkWidth(function(l) { return l.baseWidth; })
        .linkOpacity(0.65)
        .linkDirectionalParticles(function(l) { return l.particles; })
        .linkDirectionalParticleSpeed(function(l) { return l.speed; })
        .linkDirectionalParticleWidth(function(l) { return l.pWidth; })
        .linkDirectionalParticleColor(function(l) { return l.pColor; })
        .onNodeHover(function(node) {
          elem.style.cursor = node ? "pointer" : "grab";
          hoveredNodeId = node ? node.id : null;
          if (node) {
            computeNeighborhood(node);
          } else if (selectedNodeId) {
            var sel = currentNodes.find(function(n) { return n.id === selectedNodeId; });
            computeNeighborhood(sel);
          } else {
            highlightNodes.clear();
            highlightLinks.clear();
          }
          updateGlowStates();
          refreshHighlights();
        })
        .onNodeClick(function(node) {
          if (!node) return;
          selectAndGlowNode(node);
          flyToNode(node);
        })
        .onBackgroundClick(function() {
          selectedNodeId = null;
          hoveredNodeId = null;
          highlightNodes.clear();
          highlightLinks.clear();
          updateGlowStates();
          refreshHighlights();
        });

      var scene = Graph3D.scene();
      scene.add(customGroup);

      // Lighting for the faceted 3D Purple Obsidian Stone
      scene.add(new THREE.AmbientLight(0xd8b4fe, 1.35));
      var keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
      keyLight.position.set(-140, 220, 260);
      scene.add(keyLight);
      var rimLight = new THREE.DirectionalLight(0xa855f7, 1.6);
      rimLight.position.set(180, -140, -180);
      scene.add(rimLight);

      // Full 360-degree OrbitControls
      var ctrls = Graph3D.controls();
      if (ctrls) {
        ctrls.enableDamping = true;
        ctrls.dampingFactor = 0.07;
        ctrls.enableRotate = true;
        ctrls.enableZoom = true;
        ctrls.enablePan = true;
        ctrls.rotateSpeed = 0.85;
        ctrls.zoomSpeed = 1.15;
        ctrls.panSpeed = 0.9;
        ctrls.minDistance = 40;
        ctrls.maxDistance = 1500;
        ctrls.target.set(0, 0, 0);
        ctrls.autoRotate = autoOrbitOn;
        ctrls.autoRotateSpeed = 0.45;
        ctrls.addEventListener("start", function() {
          if (autoOrbitOn) {
            autoOrbitOn = false;
            var b = document.getElementById("btnOrbit");
            if (b) { b.textContent = "Orbit: OFF"; b.className = ""; }
            ctrls.autoRotate = false;
          }
        });
      }

      Graph3D.cameraPosition({ x: 0, y: 12, z: 485 }, { x: 0, y: 0, z: 0 });

      var clock = 0;
      (function animateAll() {
        requestAnimationFrame(animateAll);
        clock += 0.03;

        if (starField) starField.rotation.y += 0.0002;
        if (stoneMeshGroup) {
          stoneMeshGroup.rotation.y = Math.sin(clock * 0.35) * 0.22;
        }

        // Subtle breathing pulse on whichever node is currently selected
        if (selectedNodeId) {
          var selNode = currentNodes.find(function(n) { return n.id === selectedNodeId; });
          if (selNode && selNode.visuals && selNode.visuals.selRing) {
            var sPulse = 1.65 + Math.sin(clock * 2.2) * 0.25;
            selNode.visuals.selRing.scale.set(sPulse, sPulse, sPulse);
          }
        }

        for (var i = 0; i < streamPulses.length; i++) {
          var p = streamPulses[i];
          p.t = (p.t + p.speed) % 1.0;
          p.mesh.position.copy(p.curve.getPointAt(p.t));
        }
      })();

      window.addEventListener("resize", function() {
        Graph3D.width(window.innerWidth);
        Graph3D.height(window.innerHeight);
      });
    }

    function matchTimeWindow(hourNpt, win) {
      if (win === "ALL" || hourNpt < 0) return true;
      if (win === "MORNING") return hourNpt >= 9 && hourNpt <= 11;
      if (win === "MARKET")  return hourNpt >= 12 && hourNpt <= 14;
      if (win === "EOD")     return hourNpt >= 15 && hourNpt <= 17;
      if (win === "NIGHT")   return hourNpt >= 18 || hourNpt <= 8;
      return true;
    }

    function rebuildObsidianScene() {
      var q = document.getElementById("searchBox").value.trim().toUpperCase();
      var win = document.getElementById("timeWindow").value;
      var mode = document.getElementById("signalFilter").value;

      var filteredTele = (RAW.telemetry || []).filter(function(ev) {
        return matchTimeWindow(ev.hourNpt, win);
      });

      var fnEventsMap = {};
      var activeFnSet = new Set();
      var errorFnSet = new Set();

      filteredTele.forEach(function(ev) {
        [ev.fnName, ev.parentFn].forEach(function(key) {
          if (!key) return;
          if (!fnEventsMap[key]) fnEventsMap[key] = [];
          fnEventsMap[key].push(ev);
          activeFnSet.add(key);
          if (ev.status === "ERR") errorFnSet.add(key);
        });
      });

      var nodes = [];
      var links = [];
      var fnNodeMap = {};

      // 1. LEFT: Input Brain Nodes
      FUNCTION_TOPOLOGY.forEach(function(fn) {
        var evs = fnEventsMap[fn.id] || [];
        var isAct = activeFnSet.has(fn.id);
        var fNode = {
          id: "FN_" + fn.id,
          kind: "fn",
          label: fn.label,
          role: fn.role,
          parent: fn.parent,
          isActive: isAct,
          hasError: errorFnSet.has(fn.id),
          runCount: evs.length,
          events: evs,
          bx: fn.bx, by: fn.by, bz: fn.bz,
          fx: fn.bx, fy: fn.by, fz: fn.bz
        };
        nodes.push(fNode);
        fnNodeMap[fn.id] = fNode;

        if (fn.parent) {
          links.push({
            source: "FN_" + fn.parent,
            target: "FN_" + fn.id,
            baseColor: isAct ? "rgba(56, 189, 248, 0.78)" : "rgba(148, 163, 184, 0.28)",
            baseWidth: isAct ? 1.4 : 0.6,
            particles: isAct ? 3 : 0,
            speed: 0.012,
            pWidth: 2.0,
            pColor: "#38bdf8"
          });
        }
      });

      // 2. CENTER: Faceted Purple Obsidian Stone
      nodes.push({
        id: "OBSIDIAN_CORE",
        kind: "core",
        label: "OBSIDIAN CORE",
        fx: CORE_CENTER_X,
        fy: 0,
        fz: 0
      });

      // 3. RIGHT: Obsidian Starburst Knowledge Graph (350+ NEPSE Companies)
      var filteredSetups = (RAW.setups || []).filter(function(s) {
        if (mode === "DEBATED" && s.signal === "SCAN") return false;
        if (mode === "ACTIONABLE" && (s.signal === "WATCH" || s.signal === "SCAN" || s.macro_approved === 0)) return false;
        if (mode === "HELD" && !s.in_portfolio) return false;
        if (q && s.ticker.indexOf(q) === -1 && s.sector.indexOf(q) === -1) return false;
        return true;
      });

      var sectorGroups = {};
      var sectorList = [];
      filteredSetups.forEach(function(s) {
        if (!sectorGroups[s.sector]) {
          sectorGroups[s.sector] = [];
          sectorList.push(s.sector);
        }
        sectorGroups[s.sector].push(s);
      });

      // Sort sectors largest-first so major starburst wheels (Hydro, Banking, Microfinance) anchor the 3D composition
      sectorList.sort(function(a, b) {
        return sectorGroups[b].length - sectorGroups[a].length;
      });

      var sectorNodeMap = {};
      var totalSectors = Math.max(1, sectorList.length);
      sectorList.forEach(function(sec, idx) {
        var phi = Math.acos(1 - 2 * (idx + 0.5) / totalSectors);
        var theta = Math.PI * (1 + Math.sqrt(5)) * idx;
        var hubOrbit = idx === 0 ? 46 : (idx < 4 ? 76 : 94);
        var sx = OUTPUT_CENTER_X + hubOrbit * Math.sin(phi) * Math.cos(theta);
        var sy = hubOrbit * Math.cos(phi);
        var sz = hubOrbit * Math.sin(phi) * Math.sin(theta);

        var sNode = {
          id: "S_" + sec,
          kind: "sector",
          label: sec,
          count: sectorGroups[sec].length,
          tx: sx, ty: sy, tz: sz,
          fx: sx, fy: sy, fz: sz
        };
        nodes.push(sNode);
        sectorNodeMap[sec] = sNode;
      });

      // Inter-hub web connecting the Obsidian starburst centers
      for (var sIdx = 0; sIdx < sectorList.length; sIdx++) {
        if (sectorList.length > 1) {
          links.push({
            source: "S_" + sectorList[sIdx],
            target: "S_" + sectorList[(sIdx + 1) % sectorList.length],
            baseColor: "rgba(168, 85, 247, 0.35)",
            baseWidth: 0.9,
            particles: 1,
            speed: 0.005,
            pWidth: 1.5,
            pColor: "#c084fc"
          });
        }
      }

      // Arrange each sector's companies in a crisp radial Fibonacci starburst sphere around their Sector Hub
      var nrbSeen = {};
      var allTickerNodes = [];

      sectorList.forEach(function(sec) {
        var hub = sectorNodeMap[sec];
        var members = sectorGroups[sec];
        var mCount = members.length;

        members.forEach(function(s, mIdx) {
          var isScan = s.signal === "SCAN";
          var isPriority = !isScan || s.in_portfolio;
          var nid = "T_" + s.ticker;

          var phi = Math.acos(1 - 2 * (mIdx + 0.5) / Math.max(1, mCount));
          var theta = Math.PI * (1 + Math.sqrt(5)) * mIdx;
          // Two concentric starburst rings around each sector hub just like Obsidian graph view
          var spokeLen = (mIdx % 2 === 0 ? 22 : 36) + Math.min(14, mCount * 0.14);

          var tx = hub.tx + spokeLen * Math.sin(phi) * Math.cos(theta);
          var ty = hub.ty + spokeLen * Math.cos(phi);
          var tz = hub.tz + spokeLen * Math.sin(phi) * Math.sin(theta);

          var tNode = {
            id: nid,
            kind: "ticker",
            data: s,
            fx: tx, fy: ty, fz: tz
          };
          nodes.push(tNode);
          allTickerNodes.push(tNode);

          // Crisp radial Obsidian spoke from Sector Hub -> Company
          links.push({
            source: "S_" + sec,
            target: nid,
            baseColor: isPriority ? "rgba(0, 255, 157, 0.58)" : "rgba(203, 213, 225, 0.24)",
            baseWidth: isPriority ? 1.15 : 0.42,
            particles: isPriority ? 2 : 0,
            speed: 0.009,
            pWidth: 1.8,
            pColor: "#00ff9d"
          });

          // Direct telemetry bridge if a function acted on this ticker
          filteredTele.forEach(function(ev) {
            if (ev.targetTicker === s.ticker) {
              links.push({
                source: "FN_" + ev.fnName,
                target: nid,
                baseColor: "rgba(56, 189, 248, 0.55)",
                baseWidth: 1.0,
                particles: 3,
                speed: 0.01,
                pWidth: 1.8,
                pColor: "#38bdf8"
              });
            }
          });

          if (s.citation_chunk_id) {
            var cid = "N_" + s.citation_chunk_id;
            if (!nrbSeen[cid]) {
              nrbSeen[cid] = true;
              nodes.push({
                id: cid,
                kind: "nrb",
                label: s.citation_chunk_id,
                fx: hub.tx, fy: hub.ty + 14, fz: hub.tz
              });
            }
            links.push({
              source: cid,
              target: nid,
              baseColor: "rgba(255, 61, 87, 0.55)",
              baseWidth: 1.0,
              particles: 2,
              speed: 0.008,
              pWidth: 1.6,
              pColor: "#ff3d57"
            });
          }
        });
      });

      // Subtle outer-ring triangulation between neighboring companies in the same sector
      sectorList.forEach(function(sec) {
        var secNodes = allTickerNodes.filter(function(n) { return n.data.sector === sec; });
        for (var i = 0; i < secNodes.length - 1; i += 2) {
          links.push({
            source: secNodes[i].id,
            target: secNodes[i + 1].id,
            baseColor: "rgba(148, 163, 184, 0.14)",
            baseWidth: 0.3,
            particles: 0,
            speed: 0.005,
            pWidth: 1.0,
            pColor: "#cbd5e1"
          });
        }
      });

      currentNodes = nodes;
      currentLinks = links;
      document.getElementById("nodeCount").textContent =
        "INPUT BRAIN: " + activeFnSet.size + "/" + FUNCTION_TOPOLOGY.length + " ACTIVE // OBSIDIAN CORE // OUTPUT: " + filteredSetups.length + " COMPANIES";

      if (!Graph3D) init3DScene();
      buildBackdropAndStreams(activeFnSet, fnNodeMap, sectorNodeMap);
      Graph3D.graphData({ nodes: nodes, links: links });

      setTimeout(function() {
        updateGlowStates();
        refreshHighlights();
      }, 60);

      if (!selectedNodeId) {
        showDefaultOverview(filteredTele, filteredSetups);
      }

      var tblHtml = '<h3 style="color:#38bdf8;margin-bottom:8px">INPUT BRAIN: LIVE FUNCTION EXECUTION LOG (' + filteredTele.length + ' RUNS)</h3>' +
        '<table style="margin-bottom:24px"><thead><tr><th>Time (NPT)</th><th>Function</th><th>Triggered By</th><th>Status</th><th>Target</th><th>Telemetry Detail</th></tr></thead><tbody>';
      filteredTele.slice().reverse().forEach(function(ev) {
        tblHtml += '<tr><td>' + ev.nptTime + '</td><td><b style="color:#38bdf8">' + ev.fnName + '</b></td><td>' + ev.parentFn +
          '</td><td><span class="badge ' + (ev.status === "ERR" ? "b-red" : "b-cyan") + '">' + ev.status + '</span></td><td>' + (ev.targetTicker || '—') +
          '</td><td>' + ev.detail + '</td></tr>';
      });
      tblHtml += '</tbody></table><h3 style="color:#c084fc;margin-bottom:8px">OUTPUT MARKET: 350+ NEPSE COMPANIES (' + filteredSetups.length + ' SECURITIES)</h3>' +
        '<table><thead><tr><th>Ticker</th><th>Sector</th><th>Signal</th><th>LTP</th><th>Entry Zone</th><th>SL / Target</th><th>Kelly</th><th>20D Turn</th></tr></thead><tbody>';
      filteredSetups.forEach(function(s) {
        var bCls = s.macro_approved === 0 ? "b-red" : (s.signal === "SCAN" ? "b-purple" : (s.signal === "WATCH" || s.signal === "PULLBACK" ? "b-amber" : "b-green"));
        tblHtml += '<tr><td><b>' + s.ticker + (s.in_portfolio ? ' ★' : '') + '</b></td><td>' + s.sector +
          '</td><td><span class="badge ' + bCls + '">' + s.signal + '</span></td><td>Rs ' + s.ltp + '</td><td>' + (s.entry_zone || '—') +
          '</td><td>' + s.stop_loss + ' / ' + s.target + '</td><td>' + (s.kelly_pct > 0 ? (s.kelly_pct * 100).toFixed(1) + '%' : '—') +
          '</td><td>Rs ' + (s.avg_turnover_20d / 1e7).toFixed(2) + ' Cr</td></tr>';
      });
      tblHtml += '</tbody></table>';
      document.getElementById("tableView").innerHTML = tblHtml;
    }

    setInterval(function() {
      if (!livePollOn) return;
      var baseUrl = window.location.href.split("?")[0];
      fetch(baseUrl + "?action=telemetry")
        .then(function(r) { return r.json(); })
        .then(function(fresh) {
          if (fresh && fresh.telemetry) {
            RAW = fresh;
            document.getElementById("stamp").textContent = "[" + RAW.updatedAt + "]";
            rebuildObsidianScene();
          }
        })
        .catch(function() {});
    }, 15000);

    rebuildObsidianScene();
    // ==================== 120 FPS BRAIN BRIDGE FOR F.R.I.D.A.Y. ====================
(function() {

         : ((typeof graph !== 'undefined') ? graph
         : ((typeof fg !== 'undefined') ? fg : window.Graph));

  if (!_g) return;
  window.Graph = _g;

  // 1. Optimize WebGL renderer & physics for smooth 120 FPS
  try {
    if (typeof _g.renderer === 'function' && _g.renderer()) {
      _g.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }
    if (typeof _g.cooldownTicks === 'function') {
      _g.cooldownTicks(100); // Settle layout cleanly so GPU stays free at 120 FPS
    }

      _g.d3AlphaDecay(0.035);
    }
  } catch (e) {}

  // 2. Listen for F.R.I.D.A.Y.'s node highlight signal and illuminate the active 3D sphere
  var baseNodeColor = (typeof _g.nodeColor === 'function') ? _g.nodeColor() : null;

  window.addEventListener('friday:brainHighlight', function(e) {

          return detail.color || '#00f5d4';
        }
        return typeof baseNodeColor === 'function' ? baseNodeColor(node) : (node.color || '#ffb340');
      });
    }
  });

  window.addEventListener('friday:clearHighlight', function() {
    window.__fridayHighlightedNodeId = null;

  });
