<!-- ==================== REAL HUMAN MOVIE AUDIO & REACTIVE HUD WAVEFORM ENGINE ==================== -->
<script>
(function() {
  if (window.__fridayHindiVoiceInstalled) return;
  window.__fridayHindiVoiceInstalled = true;

  var studioConfig = { enabled: false, provider: '' };
  var sessionToken = 0;
  var activeAudio = null;
  var audioCtx = null;
  var analyser = null;
  var levelRaf = null;

  // Check if ElevenLabs / OpenAI / Google Chirp 3 HD key is set in Script Properties
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    try {
      google.script.run
        .withSuccessHandler(function(cfg) {
          if (cfg && cfg.enabled) {
            studioConfig = cfg;
            var subTag = document.getElementById('friday-subtitle-tag');
            if (subTag && subTag.textContent.indexOf('F.R.I.D.A.Y.') > -1) {
              subTag.textContent = '[F.R.I.D.A.Y. · HUMAN STUDIO (' + String(cfg.provider).toUpperCase() + ')]';
            }
          }
        })
        .getHumanVoiceConfig();
    } catch (e) {}
  }

  // Track real-time vocal loudness so the Iron Man HUD waveform pulses in sync with every syllable
  function attachWaveformAnalyser(audioEl) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) {
        audioCtx = new Ctx();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        analyser.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      var src = audioCtx.createMediaElementSource(audioEl);
      src.connect(analyser);

      var dataArr = new Uint8Array(analyser.frequencyBinCount);
      function sampleLevel() {
        if (!window.__fridayIsSpeaking) {
          window.__fridayAudioLevel = 0;
          return;
        }
        analyser.getByteFrequencyData(dataArr);
        var sum = 0;
        for (var i = 0; i < dataArr.length; i++) sum += dataArr[i];
        window.__fridayAudioLevel = Math.min(1, (sum / dataArr.length) / 95);
        levelRaf = requestAnimationFrame(sampleLevel);
      }
      sampleLevel();
    } catch (e) {
      window.__fridayAudioLevel = 0.65;
    }
  }

  function pickBestFemaleVoice() {
    if (!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var blacklist = /david|mark|guy|davis|tony|ryan|george|daniel|ravi|hemant|madhur|prabhat|andrew|brian|male/i;
    var priority = [
      'Microsoft Ava Multilingual Online (Natural)',
      'Microsoft Emma Multilingual Online (Natural)',
      'Microsoft Sonia Online (Natural)',
      'Microsoft Aria Online (Natural)',
      'Microsoft Jenny Online (Natural)',
      'Microsoft Neerja Online (Natural)',
      'Microsoft Swara Online (Natural)',
      'Google UK English Female',
      'Zira'
    ];
    for (var p = 0; p < priority.length; p++) {
      var target = priority[p].toLowerCase();
      for (var i = 0; i < voices.length; i++) {
        if (!blacklist.test(voices[i].name) && voices[i].name.toLowerCase().indexOf(target) > -1) {
          return voices[i];
        }
      }
    }
    for (var j = 0; j < voices.length; j++) {
      if (!blacklist.test(voices[j].name) && /female|natural/i.test(voices[j].name)) return voices[j];
    }
    return null;
  }

  function splitSentences(text) {
    var parts = String(text || '').match(/[^.?!…]+[.?!…]*\s*/g);
    return (parts && parts.length) ? parts.map(function(s) { return s.trim(); }).filter(Boolean) : [text];
  }

  function stopPlayback() {
    sessionToken++;
    window.__fridayIsSpeaking = false;
    window.__fridayAudioLevel = 0;
    if (levelRaf) cancelAnimationFrame(levelRaf);
    if (activeAudio) {
      try {
        activeAudio.pause();
        activeAudio.src = '';
      } catch (e) {}
      activeAudio = null;
    }
  }

  var nativeSpeak = ('speechSynthesis' in window && typeof window.speechSynthesis.speak === 'function')
    ? window.speechSynthesis.speak.bind(window.speechSynthesis)
    : null;
  var nativeCancel = ('speechSynthesis' in window && typeof window.speechSynthesis.cancel === 'function')
    ? window.speechSynthesis.cancel.bind(window.speechSynthesis)
    : null;

  function fallbackSpeak(text, rootUtter, token) {
    var u = new SpeechSynthesisUtterance(text);
    u.__fridayReady = true;
    u.rate = 0.96;
    u.pitch = 1.04;
    var v = pickBestFemaleVoice();
    if (v) u.voice = v;

    window.__fridayIsSpeaking = true;
    window.__fridayAudioLevel = 0.62;

    u.onend = function() {
      if (token === sessionToken) {
        window.__fridayIsSpeaking = false;
        window.__fridayAudioLevel = 0;
        if (typeof rootUtter.onend === 'function') {
          try { rootUtter.onend(new Event('end')); } catch (e) {}
        }
      }
    };
    u.onerror = u.onend;
    nativeSpeak(u);
  }

  if (nativeSpeak && nativeCancel) {
    window.speechSynthesis.cancel = function() {
      stopPlayback();
      return nativeCancel();
    };

    window.speechSynthesis.speak = function(rootUtter) {
      if (!rootUtter) return;
      if (rootUtter.__fridayReady) return nativeSpeak(rootUtter);

      stopPlayback();
      var myToken = sessionToken;
      var cleanText = String(rootUtter.text || '').trim()
        .replace(/\bR:R\b/gi, 'Risk to Reward')
        .replace(/\bLTP\b/g, 'Last Traded Price')
        .replace(/\bSL\b/g, 'Stop Loss');

      if (typeof rootUtter.onstart === 'function') {
        try { rootUtter.onstart(new Event('start')); } catch (e) {}
      }

      if (!studioConfig.enabled || typeof google === 'undefined' || !google.script || !google.script.run) {
        fallbackSpeak(cleanText, rootUtter, myToken);
        return;
      }

      // Parallel sentence prefetch: requests all sentences simultaneously for zero inter-sentence gap
      var sentences = splitSentences(cleanText);
      var promises = sentences.map(function(sentence) {
        return new Promise(function(resolve) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(function() { resolve(null); })
            .synthesizeHumanVoice(sentence, 'english');
        });
      });

      var idx = 0;
      function playNextHumanChunk() {
        if (myToken !== sessionToken) return;
        if (idx >= promises.length) {
          window.__fridayIsSpeaking = false;
          window.__fridayAudioLevel = 0;
          if (typeof rootUtter.onend === 'function') {
            try { rootUtter.onend(new Event('end')); } catch (e) {}
          }
          return;
        }

        promises[idx].then(function(res) {
          if (myToken !== sessionToken) return;
          if (!res || !res.audioBase64) {
            fallbackSpeak(sentences.slice(idx).join(' '), rootUtter, myToken);
            return;
          }

          var audio = new Audio('data:' + (res.mimeType || 'audio/mp3') + ';base64,' + res.audioBase64);
          activeAudio = audio;
          window.__fridayIsSpeaking = true;
          attachWaveformAnalyser(audio);

          audio.onended = function() {
            activeAudio = null;
            idx++;
            playNextHumanChunk();
          };
          audio.onerror = function() {
            activeAudio = null;
            fallbackSpeak(sentences.slice(idx).join(' '), rootUtter, myToken);
          };

          audio.play().catch(function() {
            fallbackSpeak(sentences.slice(idx).join(' '), rootUtter, myToken);
          });
        });
      }

      playNextHumanChunk();
    };
  }
})();
</script>
<!-- ==================== END REAL HUMAN MOVIE AUDIO & REACTIVE HUD WAVEFORM ENGINE ==================== -->
