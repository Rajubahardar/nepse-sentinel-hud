<!-- ==================== IRON MAN HUD 3D KNOWLEDGE GRAPH VOICE EXECUTOR ==================== -->
<style>
  #jarvis-mic-btn {
    border-color: #00f5d4 !important;
    color: #00f5d4 !important;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #jarvis-mic-btn.active {
    background: rgba(244, 63, 94, 0.28) !important;
    border-color: #f43f5e !important;
    color: #ffe4e6 !important;
    box-shadow: 0 0 14px rgba(244, 63, 94, 0.55);
  }
  #jarvis-mic-close-btn {
    border-color: #f43f5e !important;
    color: #fda4af !important;
    background: rgba(244, 63, 94, 0.16) !important;
    display: none;
    align-items: center;
    padding: 6px 10px !important;
  }
  #jarvis-mic-close-btn:hover {
    background: #f43f5e !important;
    color: #ffffff !important;
  }
</style>

<script>
(function() {
  if (window.__jarvisVoiceCommandRouterInstalled) return;
  window.__jarvisVoiceCommandRouterInstalled = true;

  var isEmbeddedInShell = (window.parent !== window);
  var isVoiceOpen = false;
  var cachedGraph = null;
  var SHELL_URL = 'https://rajubahardar.github.io/nepse-sentinel-hud/';

  // 1. Capture live ForceGraph3D instance from DOM container (__kapsuleInstance) or globals
  function resolveGraphInstance() {
    if (cachedGraph && typeof cachedGraph.graphData === 'function') return cachedGraph;

    var globals = [window.Graph, window.graph, window.knowledgeGraph, window.fg, window.graph3d];
    for (var i = 0; i < globals.length; i++) {
      if (globals[i] && typeof globals[i].graphData === 'function') {
        cachedGraph = globals[i];
        return cachedGraph;
      }
    }

    var divs = document.querySelectorAll('div');
    for (var d = 0; d < divs.length; d++) {
      var el = divs[d];
      if (el.__kapsuleInstance && typeof el.__kapsuleInstance.graphData === 'function') {
        cachedGraph = el.__kapsuleInstance;
        window.Graph = cachedGraph;
        return cachedGraph;
      }
      var keys = Object.keys(el);
      for (var k = 0; k < keys.length; k++) {
        var prop = el[keys[k]];
        if (prop && typeof prop === 'function' && typeof prop.graphData === 'function' && typeof prop.cameraPosition === 'function') {
          cachedGraph = prop;
          window.Graph = cachedGraph;
          return cachedGraph;
        }
      }
    }
    return null;
  }

  function postToShell(payload) {
    if (isEmbeddedInShell) {
      try { window.parent.postMessage(payload, '*'); } catch (e) {}
    }
  }

  // Notify parent voice shell when F.R.I.D.A.Y. is speaking so her voice never triggers commands
  var lastSpeaking = false;
  setInterval(function() {
    var speaking = Boolean(window.__fridayIsSpeaking || (window.speechSynthesis && window.speechSynthesis.speaking));
    if (speaking !== lastSpeaking) {
      lastSpeaking = speaking;
      postToShell({ type: 'JARVIS_AI_SPEAKING', speaking: speaking });
    }
  }, 100);

  function speakReply(msg) {
    var subTag = document.getElementById('friday-subtitle-tag');
    var subText = document.getElementById('friday-subtitle-text');
    if (subTag) subTag.textContent = '[F.R.I.D.A.Y. · VOICE]';
    if (subText) subText.textContent = msg;

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(msg);
      window.speechSynthesis.speak(u);
    }
  }

  function updateDockButtons() {
    var micBtn = document.getElementById('jarvis-mic-btn');
    var closeBtn = document.getElementById('jarvis-mic-close-btn');
    if (micBtn) {
      micBtn.classList.toggle('active', isVoiceOpen);
      micBtn.innerHTML = isVoiceOpen ? '● VOICE ON' : '🎙️ VOICE';
    }
    if (closeBtn) {
      closeBtn.style.display = isVoiceOpen ? 'inline-flex' : 'none';
    }
  }

  // 2. Real 3D Knowledge Graph & HUD Action Helpers
  function getGraphNodes() {
    var g = resolveGraphInstance();
    if (!g || typeof g.graphData !== 'function') return [];
    var data = g.graphData();
    return (data && data.nodes) || [];
  }

  function getStockNodes() {
    return getGraphNodes().filter(function(n) {
      var sig = String(n.signal || '').toUpperCase();
      var grp = String(n.group || n.type || n.category || '').toLowerCase();
      return sig === 'BUY' || sig === 'WATCH' || sig === 'SELL' ||
             grp.indexOf('stock') > -1 || grp.indexOf('ticker') > -1 ||
             typeof n.ltp !== 'undefined' || typeof n.target !== 'undefined';
    });
  }

  function triggerRealClick(el) {
    if (!el) return;
    ['pointerdown', 'mousedown', 'mouseup', 'click'].forEach(function(evtName) {
      el.dispatchEvent(new MouseEvent(evtName, { bubbles: true, cancelable: true, view: window }));
    });
  }

  function clickButtonMatching(keywords) {
    var nodes = document.querySelectorAll('button, [role="button"], a');
    for (var i = 0; i < nodes.length; i++) {
      var txt = (nodes[i].textContent || '').trim().toUpperCase();
      if (!txt || nodes[i].id === 'jarvis-mic-btn' || nodes[i].id === 'jarvis-mic-close-btn') continue;
      for (var k = 0; k < keywords.length; k++) {
        if (txt.indexOf(keywords[k]) > -1) {
          triggerRealClick(nodes[i]);
          return true;
        }
      }
    }
    return false;
  }

  function ensureVisorEngaged() {
    var helmetBtn = document.getElementById('friday-helmet-btn');
    if (helmetBtn && helmetBtn.textContent.toUpperCase().indexOf('HELMET ON') > -1) {
      triggerRealClick(helmetBtn);
      return;
    }
    clickButtonMatching(['HELMET ON', 'ENGAGE HELMET', 'ENGAGE VISOR']);
  }

  function focusAndActivateNode(node, openChart) {
    if (!node) return;
    var g = resolveGraphInstance();
    var ticker = String(node.ticker || node.name || node.label || node.id || '').toUpperCase();

    // Highlight node reticle
    window.dispatchEvent(new CustomEvent('friday:brainHighlight', {
      detail: { keywords: [ticker, node.id, node.name], color: '#00f5d4', isFinal: true }
    }));

    // Fly 3D camera onto node coordinates
    if (g && typeof g.cameraPosition === 'function' && typeof node.x === 'number') {
      var dist = 88;
      var hypot = Math.hypot(node.x, node.y, node.z) || 1;
      var ratio = 1 + dist / hypot;
      g.cameraPosition(
        { x: node.x * ratio, y: node.y * ratio, z: node.z * ratio },
        { x: node.x, y: node.y, z: node.z },
        750
      );
    }

    // Fire ForceGraph3D's native onNodeClick handler
    if (g && typeof g.onNodeClick === 'function') {
      var handler = g.onNodeClick();
      if (typeof handler === 'function') {
        try {
          handler(node, new MouseEvent('click', { bubbles: true }));
        } catch (e) {
          handler(node);
        }
      }
    }

    if (openChart) {
      ensureVisorEngaged();
      setTimeout(function() {
        clickButtonMatching(['SPLIT', 'LIVE CHART', 'CHART']);
      }, 150);
    }
  }

  // 3. Execute Spoken Task Immediately
  function executeVoiceCommand(rawText) {
    var cmd = String(rawText || '').trim();
    var lower = cmd.toLowerCase();
    if (!lower) return;

    var stocks = getStockNodes();
    var allNodes = getGraphNodes();

    // Match any spoken stock ticker
    var mentionedStock = null;
    for (var i = 0; i < stocks.length; i++) {
      var sym = String(stocks[i].ticker || stocks[i].name || stocks[i].id || '').toLowerCase().trim();
      if (sym && sym.length >= 2 && new RegExp('\\b' + sym.replace(/[^a-z0-9]/g, '') + '\\b', 'i').test(lower)) {
        mentionedStock = stocks[i];
        break;
      }
    }

    // TASK 1: Open Chart
    if (/\b(chart|graph|candle|nepsealpha|tradingview)\b/.test(lower)) {
      var target = mentionedStock ||
        stocks.find(function(s) { return String(s.signal || '').toUpperCase() === 'BUY'; }) ||
        stocks[0];

      ensureVisorEngaged();
      clickButtonMatching(['SPLIT', 'LIVE']);

      if (target) {
        var symName = String(target.ticker || target.name || target.id).toUpperCase();
        focusAndActivateNode(target, true);
        speakReply('Opening live chart for ' + symName + ', Raju D. sir.');
      } else {
        speakReply('Engaging visor chart view, Raju D. sir.');
      }
      return;
    }

    // TASK 2: Show Backtesting
    if (/\b(backtest|backtesting|accuracy|pga|cascade)\b/.test(lower)) {
      ensureVisorEngaged();
      if (lower.indexOf('cascade') > -1) clickButtonMatching(['CASCADE']);
      else if (lower.indexOf('pga') > -1) clickButtonMatching(['PGA-BB', 'PGA']);
      else clickButtonMatching(['COMBINED', 'BACKTEST']);

      var btPanel = document.getElementById('backtest-panel') || document.querySelector('[class*="backtest"]');
      if (btPanel) btPanel.style.display = 'block';

      speakReply('Displaying backtesting results on your visor, Raju D. sir.');
      return;
    }

    // TASK 3: Show Top Leads Today
    if (/\b(top lead|top leads|leads|top stock|best stock|buy signal|today)\b/.test(lower)) {
      var buys = stocks.filter(function(s) { return String(s.signal || '').toUpperCase() === 'BUY'; });
      var ranked = (buys.length > 0 ? buys : stocks).slice().sort(function(a, b) {
        return (Number(b.rr_ratio || b.rr || 0)) - (Number(a.rr_ratio || a.rr || 0));
      });

      if (ranked.length > 0) {
        var top3 = ranked.slice(0, 3);
        var names = top3.map(function(s) { return String(s.ticker || s.name || s.id).toUpperCase(); });
        focusAndActivateNode(top3[0], false);
        speakReply(
          'Your top leads today, Raju D. sir, are ' + names.join(', ') +
          '. Locking onto ' + names[0] + ' at ' + (top3[0].ltp || 'current') + ' rupees.'
        );
      } else {
        var briefBtn = document.getElementById('friday-briefing-btn');
        if (briefBtn) triggerRealClick(briefBtn);
      }
      return;
    }

    // TASK 4: Brain View / Diagnosis
    if (/\b(brain|disengage|helmet off|diagnosis|diagnose|function|code)\b/.test(lower)) {
      var diagBtn = document.getElementById('friday-diag-btn');
      if (diagBtn) triggerRealClick(diagBtn);
      else clickButtonMatching(['DISENGAGE', 'DIAGNOSIS', 'BRAIN']);
      return;
    }

    // TASK 5: Engage Visor
    if (/\b(helmet on|engage|visor)\b/.test(lower)) {
      ensureVisorEngaged();
      speakReply('Visor engaged, Raju D. sir.');
      return;
    }

    // TASK 6: Zoom In / Out / Reset
    var g = resolveGraphInstance();
    if (g && typeof g.cameraPosition === 'function') {
      if (/\b(zoom in|closer)\b/.test(lower)) {
        var p = g.cameraPosition();
        g.cameraPosition({ x: p.x * 0.65, y: p.y * 0.65, z: p.z * 0.65 }, null, 650);
        speakReply('Zooming in on the knowledge graph, Raju D. sir.');
        return;
      }
      if (/\b(zoom out|reset|overview)\b/.test(lower)) {
        if (typeof g.zoomToFit === 'function') g.zoomToFit(700, 40);
        else g.cameraPosition({ x: 0, y: 0, z: 320 }, { x: 0, y: 0, z: 0 }, 700);
        window.dispatchEvent(new Event('friday:clearHighlight'));
        speakReply('Resetting 3D graph view, Raju D. sir.');
        return;
      }
    }

    // TASK 7: Briefing / Silence
    if (/\b(briefing|report|summary)\b/.test(lower)) {
      var bBtn = document.getElementById('friday-briefing-btn');
      if (bBtn) triggerRealClick(bBtn);
      return;
    }
    if (/\b(stop|silence|quiet)\b/.test(lower)) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      return;
    }

    // TASK 8: Any Named Stock or Graph Node
    if (mentionedStock) {
      var mSym = String(mentionedStock.ticker || mentionedStock.name || mentionedStock.id).toUpperCase();
      focusAndActivateNode(mentionedStock, true);
      speakReply('Locking onto ' + mSym + ', Raju D. sir.');
      return;
    }

    for (var n = 0; n < allNodes.length; n++) {
      var label = String(allNodes[n].name || allNodes[n].label || allNodes[n].id || '').toLowerCase();
      if (label.length >= 3 && lower.indexOf(label) > -1) {
        focusAndActivateNode(allNodes[n], false);
        speakReply('Focusing on ' + String(allNodes[n].name || allNodes[n].id) + ', Raju D. sir.');
        return;
      }
    }
  }

  // 4. Listen for Commands from Top-Level GitHub Pages Voice Shell
  window.addEventListener('message', function(event) {
    var data = event.data || {};
    if (data.type === 'JARVIS_VOICE_OPENED') {
      isVoiceOpen = true;
      updateDockButtons();
      speakReply('Voice command open, Raju D. sir.');
    } else if (data.type === 'JARVIS_VOICE_CLOSED') {
      isVoiceOpen = false;
      updateDockButtons();
      speakReply('Voice command closed, Raju D. sir.');
    } else if (data.type === 'JARVIS_VOICE_CMD' && data.transcript) {
      executeVoiceCommand(data.transcript);
    }
  });

  function mountDockButtons() {
    var dock = document.getElementById('friday-voice-dock');
    if (!dock || document.getElementById('jarvis-mic-btn')) return;

    var closeBtn = document.createElement('button');
    closeBtn.id = 'jarvis-mic-close-btn';
    closeBtn.className = 'fv-btn';
    closeBtn.type = 'button';
    closeBtn.title = 'Close Voice Command';
    closeBtn.innerHTML = '✕ CLOSE VOICE';
    closeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (isEmbeddedInShell) {
        postToShell({ type: 'JARVIS_SHELL_SET_VOICE', open: false });
      }
      isVoiceOpen = false;
      updateDockButtons();
      speakReply('Voice command closed, Raju D. sir.');
    });

    var micBtn = document.createElement('button');
    micBtn.id = 'jarvis-mic-btn';
    micBtn.className = 'fv-btn';
    micBtn.type = 'button';
    micBtn.title = isEmbeddedInShell ? 'Open / Close Voice Command' : 'Launch Top-Level Voice HUD Shell';
    micBtn.innerHTML = '🎙️ VOICE';
    micBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!isEmbeddedInShell) {
        window.open(SHELL_URL, '_blank');
        return;
      }
      isVoiceOpen = !isVoiceOpen;
      postToShell({ type: 'JARVIS_SHELL_SET_VOICE', open: isVoiceOpen });
      updateDockButtons();
      speakReply(isVoiceOpen ? 'Voice command open, Raju D. sir.' : 'Voice command closed, Raju D. sir.');
    });

    dock.insertBefore(closeBtn, dock.firstChild);
    dock.insertBefore(micBtn, dock.firstChild);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountDockButtons);
  } else {
    mountDockButtons();
  }

  window.JarvisVoiceCommand = {
    run: executeVoiceCommand
  };
})();
</script>
<!-- ==================== END IRON MAN HUD 3D KNOWLEDGE GRAPH VOICE EXECUTOR ==================== -->
