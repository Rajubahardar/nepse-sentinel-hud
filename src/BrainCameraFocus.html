<!-- ==================== BRAIN CAMERA, 120 FPS NODE FOCUS & OPTICS ENGINE ==================== -->
<style>
  #brain-optics-panel {
    position: fixed;
    top: 20px;
    right: 22px;
    z-index: 999992;
    width: 252px;
    background: rgba(8, 15, 24, 0.90);
    border: 1px solid rgba(255, 179, 64, 0.55);
    border-right: 3px solid #ff8c00;
    padding: 10px 12px;
    font-family: 'Orbitron', 'Consolas', monospace;
    color: #ffe4b5;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    box-shadow: 0 0 22px rgba(255, 140, 0, 0.22);
    backdrop-filter: blur(6px);
    user-select: none;
  }

  .bo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 1.2px;
    color: #ffb340;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .bo-toggle-btn {
    background: transparent;
    border: 1px solid rgba(255, 179, 64, 0.45);
    color: #ffb340;
    font-family: 'Consolas', monospace;
    font-size: 10px;
    padding: 1px 6px;
    cursor: pointer;
  }

  .bo-toggle-btn:hover {
    background: rgba(255, 140, 0, 0.22);
  }

  .bo-row {
    margin-bottom: 8px;
  }

  .bo-row:last-child {
    margin-bottom: 0;
  }

  .bo-label {
    display: flex;
    justify-content: space-between;
    font-family: 'Consolas', monospace;
    font-size: 10.5px;
    color: #cbd5e1;
    margin-bottom: 4px;
  }

  .bo-label span:last-child {
    color: #00f5d4;
    font-weight: bold;
  }

  .bo-themes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }

  .bo-theme-btn {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(148, 163, 184, 0.3);
    color: #cbd5e1;
    font-family: 'Consolas', monospace;
    font-size: 10px;
    padding: 4px 6px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .bo-theme-btn:hover {
    border-color: #ffb340;
  }

  .bo-theme-btn.active {
    border-color: #00f5d4;
    background: rgba(0, 245, 212, 0.14);
    color: #ffffff;
    font-weight: bold;
  }

  .bo-swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #bo-glow-slider {
    width: 100%;
    accent-color: #ffb340;
    cursor: pointer;
    height: 4px;
  }
</style>

<div id="brain-optics-panel" title="Customize 3D Knowledge Graph Node Colors & Glow Intensity">
  <div class="bo-header">
    <span>BRAIN OPTICS · 120 FPS</span>
    <button id="bo-collapse-btn" class="bo-toggle-btn" type="button">−</button>
  </div>
  <div id="bo-body">
    <div class="bo-row">
      <div class="bo-label">
        <span>NODE PALETTE</span>
        <span id="bo-theme-name">SIGNAL</span>
      </div>
      <div class="bo-themes">
        <button class="bo-theme-btn active" type="button" data-theme="signal">
          <span class="bo-swatch" style="background:#00f5d4;box-shadow:0 0 6px #00f5d4;"></span>SIGNAL
        </button>
        <button class="bo-theme-btn" type="button" data-theme="mark7">
          <span class="bo-swatch" style="background:#ffb340;box-shadow:0 0 6px #ffb340;"></span>MARK VII
        </button>
        <button class="bo-theme-btn" type="button" data-theme="cyan">
          <span class="bo-swatch" style="background:#38bdf8;box-shadow:0 0 6px #38bdf8;"></span>ARCTIC
        </button>
        <button class="bo-theme-btn" type="button" data-theme="reactor">
          <span class="bo-swatch" style="background:#f43f5e;box-shadow:0 0 6px #f43f5e;"></span>REACTOR
        </button>
      </div>
    </div>
    <div class="bo-row">
      <div class="bo-label">
        <span>GLOW INTENSITY</span>
        <span id="bo-glow-val">115%</span>
      </div>
      <input id="bo-glow-slider" type="range" min="0" max="200" step="5" value="115" />
    </div>
  </div>
</div>

<script>
(function() {
  if (window.__brainCameraFocusInstalled) return;
  window.__brainCameraFocusInstalled = true;

  var THEME_KEY = 'nepse_brain_color_theme';
  var GLOW_KEY = 'nepse_brain_glow_pct';

  // Customizable role-based palettes for 3D Knowledge Graph nodes
  var PALETTES = {
    signal: {
      label: 'SIGNAL',
      buy: '#00f5d4',
      watch: '#ffb340',
      sector: '#38bdf8',
      func: '#a78bfa',
      sheet: '#f472b6',
      defaultNode: '#fbbf24'
    },
    mark7: {
      label: 'MARK VII',
      buy: '#ffd166',
      watch: '#ff8c00',
      sector: '#ffb340',
      func: '#fb7185',
      sheet: '#fde047',
      defaultNode: '#ffa500'
    },
    cyan: {
      label: 'ARCTIC',
      buy: '#00f5d4',
      watch: '#38bdf8',
      sector: '#818cf8',
      func: '#c084fc',
      sheet: '#22d3ee',
      defaultNode: '#7dd3fc'
    },
    reactor: {
      label: 'REACTOR',
      buy: '#00f5d4',
      watch: '#f43f5e',
      sector: '#fb923c',
      func: '#e879f9',
      sheet: '#facc15',
      defaultNode: '#fb7185'
    }
  };

  var currentTheme = localStorage.getItem(THEME_KEY) || 'signal';
  if (!PALETTES[currentTheme]) currentTheme = 'signal';

  var glowPercent = Number(localStorage.getItem(GLOW_KEY));
  if (isNaN(glowPercent)) glowPercent = 115;

  var brainGraph = null;
  var baseNodeVal = null;
  var baseThreeObj = null;
  var savedAutoRotate = null;
  var glowTexture = null;
  var spriteRegistry = []; // Tracks active halo sprites for zero-lag 120 FPS slider updates

  var activeNode = null;
  var activeColor = '#00f5d4';
  var curX = window.innerWidth * 0.56;
  var curY = window.innerHeight * 0.48;
  var targetX = curX;
  var targetY = curY;
  var lastTime = performance.now();
  var rafId = null;

  // Build shared radial-gradient texture once so 120 FPS rendering stays GPU-light
  function getRadialGlowTexture() {
    if (glowTexture || typeof window.THREE === 'undefined') return glowTexture;
    var size = 128;
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');
    var half = size / 2;
    var grad = ctx.createRadialGradient(half, half, 2, half, half, half);
    grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
    grad.addColorStop(0.28, 'rgba(255, 255, 255, 0.72)');
    grad.addColorStop(0.62, 'rgba(255, 255, 255, 0.22)');
    grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);

    glowTexture = new window.THREE.CanvasTexture(canvas);
    return glowTexture;
  }

  // Classify each node by its metadata so colors match its semantic role
  function resolveNodeColor(nd) {
    var pal = PALETTES[currentTheme] || PALETTES.signal;
    var targetId = window.__fridayHighlightedNodeId;
    var id = nd.id !== undefined ? nd.id : nd.name;

    if (targetId && id === targetId) {
      return activeColor || '#00f5d4';
    }

    var sig = String(nd.signal || '').toUpperCase();
    var meta = [nd.group, nd.type, nd.category, nd.id, nd.name, nd.label]
      .filter(Boolean).join(' ').toLowerCase();

    if (sig === 'BUY') return pal.buy;
    if (sig === 'WATCH' || sig === 'HOLD' || sig === 'SELL') return pal.watch;
    if (/\(\)|function|doget|sync|graph|helmet|voice|code\.js|dailynepsesync/.test(meta)) return pal.func;
    if (/setup_matrix|trade_journal|watchlist|sheet/.test(meta)) return pal.sheet;
    if (/sector|banking|hydro|finance|insurance|hotel|manufacturing|microfinance/.test(meta)) return pal.sector;
    return pal.defaultNode;
  }

  function createNodeGlowSprite(nd) {
    if (typeof window.THREE === 'undefined') return null;
    var tex = getRadialGlowTexture();
    if (!tex) return null;

    var colorHex = resolveNodeColor(nd);
    var mat = new window.THREE.SpriteMaterial({
      map: tex,
      color: new window.THREE.Color(colorHex),
      transparent: true,
      opacity: Math.min(1, (glowPercent / 100) * 0.65),
      blending: window.THREE.AdditiveBlending,
      depthWrite: false
    });

    var sprite = new window.THREE.Sprite(mat);
    var baseSize = (Number(nd.val) || 4) * 3.2;
    var mult = Math.max(0.01, glowPercent / 100);
    sprite.scale.set(baseSize * mult, baseSize * mult, 1);

    spriteRegistry.push({ sprite: sprite, node: nd, baseSize: baseSize });
    return sprite;
  }

  // Update all sprite colors and glow radii immediately in memory at 120 FPS
  function syncOpticsLive() {
    var targetId = window.__fridayHighlightedNodeId;
    var mult = glowPercent / 100;

    for (var i = spriteRegistry.length - 1; i >= 0; i--) {
      var entry = spriteRegistry[i];
      if (!entry.sprite || !entry.sprite.material) {
        spriteRegistry.splice(i, 1);
        continue;
      }
      var id = entry.node.id !== undefined ? entry.node.id : entry.node.name;
      var isFocused = targetId && id === targetId;
      var hex = resolveNodeColor(entry.node);

      entry.sprite.material.color.set(hex);
      entry.sprite.material.opacity = isFocused
        ? Math.min(1, Math.max(0.85, mult * 0.9))
        : Math.min(0.95, mult * 0.65);

      var s = entry.baseSize * (isFocused ? Math.max(1.8, mult * 1.85) : Math.max(0.01, mult));
      entry.sprite.scale.set(s, s, 1);
    }

    if (brainGraph && typeof brainGraph.nodeColor === 'function') {
      brainGraph.nodeColor(resolveNodeColor);
    }
  }

  // Expose programmatic API so you can also change colors/glow from console or other scripts
  window.setBrainOptics = function(options) {
    if (!options) return;
    if (options.theme && PALETTES[options.theme]) {
      currentTheme = options.theme;
      localStorage.setItem(THEME_KEY, currentTheme);
    }
    if (typeof options.glow === 'number') {
      glowPercent = Math.max(0, Math.min(200, options.glow));
      localStorage.setItem(GLOW_KEY, String(glowPercent));
    }
    if (options.customColors && typeof options.customColors === 'object') {
      Object.assign(PALETTES[currentTheme], options.customColors);
    }
    updateOpticsUI();
    syncOpticsLive();
  };

  function updateOpticsUI() {
    var nameEl = document.getElementById('bo-theme-name');
    var valEl = document.getElementById('bo-glow-val');
    var sliderEl = document.getElementById('bo-glow-slider');
    if (nameEl) nameEl.textContent = PALETTES[currentTheme].label;
    if (valEl) valEl.textContent = glowPercent + '%';
    if (sliderEl) sliderEl.value = String(glowPercent);

    var btns = document.querySelectorAll('.bo-theme-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].getAttribute('data-theme') === currentTheme);
    }
  }

  // Wire Optics UI controls
  var themeBtns = document.querySelectorAll('.bo-theme-btn');
  for (var b = 0; b < themeBtns.length; b++) {
    themeBtns[b].addEventListener('click', function(e) {
      e.stopPropagation();
      var chosen = this.getAttribute('data-theme');
      if (PALETTES[chosen]) {
        currentTheme = chosen;
        localStorage.setItem(THEME_KEY, currentTheme);
        updateOpticsUI();
        syncOpticsLive();
      }
    });
  }

  var glowSlider = document.getElementById('bo-glow-slider');
  if (glowSlider) {
    glowSlider.addEventListener('input', function(e) {
      e.stopPropagation();
      glowPercent = Number(this.value);
      localStorage.setItem(GLOW_KEY, String(glowPercent));
      updateOpticsUI();
      syncOpticsLive();
    });
  }

  var collapseBtn = document.getElementById('bo-collapse-btn');
  var bodyEl = document.getElementById('bo-body');
  if (collapseBtn && bodyEl) {
    collapseBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var hidden = bodyEl.style.display === 'none';
      bodyEl.style.display = hidden ? 'block' : 'none';
      collapseBtn.textContent = hidden ? '−' : '+';
    });
  }

  // 1. Register and optimize the graph instance for smooth 120 FPS rendering + glow halos
  function registerBrainGraph(inst) {
    if (!inst || brainGraph === inst) return;
    if (typeof inst.graphData !== 'function') return;

    brainGraph = inst;
    window.Graph = inst;
    spriteRegistry = [];

    try {
      if (typeof inst.renderer === 'function' && inst.renderer()) {
        inst.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      }
      if (typeof inst.cooldownTicks === 'function') {
        inst.cooldownTicks(100);
      }
      if (typeof inst.d3AlphaDecay === 'function') {
        inst.d3AlphaDecay(0.035);
      }
    } catch (e) {}

    if (typeof inst.nodeVal === 'function') {
      baseNodeVal = inst.nodeVal();
    }

    // Attach 3D additive glow halos while preserving any existing nodeThreeObject
    if (typeof window.THREE !== 'undefined' && typeof inst.nodeThreeObject === 'function') {
      baseThreeObj = inst.nodeThreeObject();
      if (typeof inst.nodeThreeObjectExtend === 'function') {
        inst.nodeThreeObjectExtend(true);
      }
      inst.nodeThreeObject(function(nd) {
        var halo = createNodeGlowSprite(nd);
        if (typeof baseThreeObj === 'function') {
          var origObj = baseThreeObj(nd);
          if (origObj && halo) {
            var grp = new window.THREE.Group();
            grp.add(origObj);
            grp.add(halo);
            return grp;
          }
          return origObj || halo;
        }
        return halo;
      });
    }

    if (typeof inst.nodeColor === 'function') {
      inst.nodeColor(resolveNodeColor);
    }
  }

  window.registerBrainGraph = registerBrainGraph;

  // 2. Intercept ForceGraph3D / ForceGraph factory calls even inside private closures
  function wrapFactory(name) {
    var orig = window[name];
    if (typeof orig !== 'function' || orig.__brainWrapped) return;
    var wrapped = function() {
      var inst = orig.apply(this, arguments);
      if (inst && (typeof inst === 'object' || typeof inst === 'function')) {
        registerBrainGraph(inst);
      }
      return inst;
    };
    for (var k in orig) {
      if (Object.prototype.hasOwnProperty.call(orig, k)) {
        wrapped[k] = orig[k];
      }
    }
    wrapped.__brainWrapped = true;
    window[name] = wrapped;
  }

  wrapFactory('ForceGraph3D');
  wrapFactory('ForceGraph');

  function discoverExistingGraph() {
    if (brainGraph) return brainGraph;
    wrapFactory('ForceGraph3D');
    wrapFactory('ForceGraph');

    var known = [window.Graph, window.graph, window.fg, window.knowledgeGraph];
    for (var i = 0; i < known.length; i++) {
      if (known[i] && typeof known[i].graphData === 'function') {
        registerBrainGraph(known[i]);
        return brainGraph;
      }
    }

    var keys = Object.keys(window);
    for (var j = 0; j < keys.length; j++) {
      try {
        var val = window[keys[j]];
        if (val && (typeof val === 'object' || typeof val === 'function') &&
            typeof val.graphData === 'function' &&
            (typeof val.cameraPosition === 'function' || typeof val.centerAt === 'function')) {
          registerBrainGraph(val);
          return brainGraph;
        }
      } catch (e) {}
    }
    return null;
  }

  var scanCount = 0;
  var scanTimer = setInterval(function() {
    scanCount++;
    if (discoverExistingGraph() || scanCount > 80) {
      clearInterval(scanTimer);
    }
  }, 200);

  // 3. Multi-tier fuzzy node matching
  function normalizeToken(str) {
    return String(str || '')
      .toLowerCase()
      .replace(/\(\)/g, '')
      .replace(/\.(js|gs|html)$/g, '')
      .replace(/[^a-z0-9]/g, '');
  }

  function findMatchingNode(nodes, keywords) {
    if (!nodes || !nodes.length || !keywords || !keywords.length) return null;

    for (var k = 0; k < keywords.length; k++) {
      var kw = String(keywords[k] || '').toLowerCase().trim();
      if (!kw) continue;
      for (var n = 0; n < nodes.length; n++) {
        var nd = nodes[n];
        var rawHaystack = [
          nd.id, nd.name, nd.label, nd.title, nd.ticker,
          nd.fn, nd.func, nd.file, nd.sector, nd.group, nd.type
        ].filter(Boolean).join(' ').toLowerCase();
        if (rawHaystack.indexOf(kw) > -1) return nd;
      }
    }

    for (var k2 = 0; k2 < keywords.length; k2++) {
      var normKw = normalizeToken(keywords[k2]);
      if (normKw.length < 3) continue;
      for (var n2 = 0; n2 < nodes.length; n2++) {
        var nd2 = nodes[n2];
        var normHaystack = normalizeToken([
          nd2.id, nd2.name, nd2.label, nd2.title, nd2.ticker, nd2.fn, nd2.file
        ].filter(Boolean).join(' '));
        if (normHaystack.indexOf(normKw) > -1) return nd2;
      }
    }

    return null;
  }

  // 4. Project 3D/2D node coordinates to screen pixels
  function projectNodeToScreen(graph, node) {
    if (!graph || !node) return null;
    var nx = Number(node.x) || 0;
    var ny = Number(node.y) || 0;
    var nz = Number(node.z) || 0;

    if (typeof graph.graph2ScreenCoords === 'function') {
      try {
        var coords = typeof graph.cameraPosition === 'function'
          ? graph.graph2ScreenCoords(nx, ny, nz)
          : graph.graph2ScreenCoords(nx, ny);
        if (coords && typeof coords.x === 'number' && !isNaN(coords.x)) {
          return coords;
        }
      } catch (e) {}
    }

    if (typeof graph.camera === 'function' && typeof graph.renderer === 'function' && window.THREE) {
      try {
        var cam = graph.camera();
        var ren = graph.renderer();
        if (cam && ren && ren.domElement) {
          var vec = new window.THREE.Vector3(nx, ny, nz);
          vec.project(cam);
          var rect = ren.domElement.getBoundingClientRect();
          return {
            x: rect.left + (vec.x * 0.5 + 0.5) * rect.width,
            y: rect.top + (-vec.y * 0.5 + 0.5) * rect.height
          };
        }
      } catch (e) {}
    }

    return null;
  }

  // 5. Smooth camera transition onto the target node
  function moveCameraToNode(graph, node, isFinal) {
    if (!graph || !node) return;

    try {
      if (typeof graph.controls === 'function' && graph.controls()) {
        var ctrls = graph.controls();
        if (savedAutoRotate === null && typeof ctrls.autoRotate === 'boolean') {
          savedAutoRotate = ctrls.autoRotate;
        }
        ctrls.autoRotate = false;
      }
    } catch (e) {}

    var nx = Number(node.x) || 0;
    var ny = Number(node.y) || 0;
    var nz = Number(node.z) || 0;

    if (typeof graph.cameraPosition === 'function') {
      var distance = isFinal ? 95 : 120;
      var mag = Math.hypot(nx, ny, nz);
      var camPos = mag > 1
        ? {
            x: nx * (1 + distance / mag) - 24,
            y: ny * (1 + distance / mag) + 10,
            z: nz * (1 + distance / mag)
          }
        : {
            x: nx - 24,
            y: ny + 16,
            z: nz + distance
          };

      graph.cameraPosition(camPos, { x: nx - 16, y: ny, z: nz }, 900);
    } else if (typeof graph.centerAt === 'function') {
      graph.centerAt(nx - 60, ny, 850);
      if (typeof graph.zoom === 'function') {
        graph.zoom(isFinal ? 3.4 : 2.6, 850);
      }
    }
  }

  // 6. Illuminate the active node and boost its halo sprite
  function applyNodeHighlight(graph, node, color) {
    if (!graph || !node) return;
    var targetId = node.id !== undefined ? node.id : node.name;
    window.__fridayHighlightedNodeId = targetId;
    activeColor = color || '#00f5d4';

    syncOpticsLive();

    if (typeof graph.nodeVal === 'function') {
      graph.nodeVal(function(nd) {
        var id = nd.id !== undefined ? nd.id : nd.name;
        var base = typeof baseNodeVal === 'function' ? baseNodeVal(nd) : (nd.val || 4);
        return id === targetId ? Math.max(base * 1.9, 10) : base;
      });
    }
  }

  // 7. 120 FPS GPU reticle sync loop
  function startReticleSyncLoop() {
    if (rafId) return;
    lastTime = performance.now();

    function step(now) {
      var holoLayer = document.getElementById('friday-holo-layer');
      if (!holoLayer || holoLayer.style.display === 'none' || !activeNode || !brainGraph) {
        rafId = null;
        return;
      }

      var projected = projectNodeToScreen(brainGraph, activeNode);
      if (projected) {
        targetX = Math.max(85, Math.min(window.innerWidth - 85, projected.x));
        targetY = Math.max(85, Math.min(window.innerHeight - 95, projected.y));
      }

      var dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      var alpha = 1 - Math.pow(1 - 0.22, dt * 60);

      curX += (targetX - curX) * alpha;
      curY += (targetY - curY) * alpha;

      var reticle = document.getElementById('friday-holo-reticle');
      var card = document.getElementById('friday-holo-card');
      var beam = document.getElementById('friday-holo-beam');
      var anchor = document.getElementById('friday-holo-anchor');

      if (reticle) {
        reticle.style.transform = 'translate3d(' + curX.toFixed(1) + 'px, ' + curY.toFixed(1) + 'px, 0)';
      }
      if (card && beam && anchor) {
        var r = card.getBoundingClientRect();
        var sx = Math.round(r.right);
        var sy = Math.round(r.top + 48);
        anchor.setAttribute('cx', sx);
        anchor.setAttribute('cy', sy);
        anchor.setAttribute('fill', activeColor);
        beam.setAttribute('x1', sx);
        beam.setAttribute('y1', sy);
        beam.setAttribute('x2', Math.round(curX));
        beam.setAttribute('y2', Math.round(curY));
        beam.setAttribute('stroke', activeColor);
      }

      rafId = requestAnimationFrame(step);
    }

    rafId = requestAnimationFrame(step);
  }

  // 8. Listen to F.R.I.D.A.Y.'s diagnosis step events
  window.addEventListener('friday:brainHighlight', function(e) {
    var detail = e.detail || {};
    var keywords = detail.keywords || [];
    activeColor = detail.color || '#00f5d4';

    var graph = discoverExistingGraph();
    if (!graph) return;

    var data = graph.graphData();
    var nodes = (data && data.nodes) || [];
    var matched = findMatchingNode(nodes, keywords);

    if (matched) {
      activeNode = matched;
      var tag = document.getElementById('holo-reticle-tag');
      if (tag) {
        tag.textContent = 'NODE: ' + String(matched.name || matched.label || matched.id || keywords[0]).toUpperCase();
      }
      applyNodeHighlight(graph, matched, activeColor);
      moveCameraToNode(graph, matched, !!detail.isFinal);
      startReticleSyncLoop();
    }
  });

  window.addEventListener('friday:clearHighlight', function() {
    activeNode = null;
    window.__fridayHighlightedNodeId = null;
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    syncOpticsLive();
    if (brainGraph) {
      try {
